[configuration]
restart = false
TransportSystem = "AuxVarTest"

Polynomial_degree = 4
Grid_size = 5
Lower_boundary =  -1.0
Upper_boundary =  1.0
t_final = 1.5
delta_t = 0.2

# Tight enough that the reference pins a solution rather than a step sequence.
#
# This case used to run at 1e-2, where its own answer is 4.1% from the converged
# one -- eight times the 5e-3 the suite compares at. Anything that changed the
# Newton path therefore moved the output past the threshold without any of it
# being wrong, and the reference had already been regenerated once for exactly
# that reason (see Tests/README.md). At 1e-6/1e-8 the answer is 4.2e-7 from a
# rtol = 1e-10 run of the same discretisation, so there are four orders of
# margin under the comparison and a differing Newton path is invisible.
#
# MinStepSize is not decoration: at the default 1e-7 this case dies with
# IDA_ERR_FAIL (-3) at these tolerances. The limit is between 1e-8 (fails) and
# 1e-9 (works), so 1e-12 leaves three orders of headroom. Cost is 0.15 s against
# the 0.07 s the loose settings took.
Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-8
MinStepSize = 1.0e-12

[DiffusionProblem]

Centre = 0.0
kappa = 1.0
