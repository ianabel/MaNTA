# The theta pinch of ThetaPinch.conf on its native equilibrium model,
# ThetaPinchPressureBalance -- radial pressure balance in closed form on the
# transport's own pressure, registered as an EquilibriumModel -- in place of the
# field model's spline. See docs/field_coupling.rst.
#
# FieldCoupling is the default, auto, which for a transient of a case with
# analytic geometry derivatives is "reduced": tier 1, the model's own response
# in the Jacobian. The reference pins the native model's geometry group as well
# as the transport; the run lands within the field model's discretisation
# error of ThetaPinch.conf's.
[configuration]
TransportSystem = "ThetaPinchDiffusion"
EquilibriumModel = "ThetaPinchPressureBalance"

PolynomialDegree = 4
GridSize = 8
LowerBoundary = 0.0
UpperBoundary = 1.0
t_final = 1.0
delta_t = 0.1
Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-8
MinStepSize = 1.0e-12

[ThetaPinchPressureBalance]
PressureAux = 0

[ThetaPinchDiffusion]
Temperature = 0.3
D0 = 0.5
Gamma = 2.0
