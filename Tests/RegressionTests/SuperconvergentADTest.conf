# ADTest with the superconvergent interpolatory scheme switched on.
#
# The rest of the regression suite runs with Superconvergent unset, which is what
# pins the flag-off path as bit-identical to the reference solutions checked in
# before this option existed. This case exists so the flag-on path has a reference
# too: it exercises a nonlinear autodiff physics case end to end -- residual,
# Jacobian, static condensation, IDA -- through the star node set.
#
# Its .ref.nc was generated by this configuration, so it locks in behaviour rather
# than verifying it against an independent answer. The verification lives in
# MMSConvergenceTests.cpp (observed order k+2) and SolveJacTests.cpp
# (J dy = g against a finite-differenced residual).

[configuration]

TransportSystem = "ADTestProblem"

PolynomialDegree = 5
GridSize = 5
LowerBoundary =  0.0
UpperBoundary =  1.0

tau = 1.0

Superconvergent = true

t_final = 1.0
delta_t = 0.25

Relative_tolerance = 1.0e-4
Absolute_tolerance = 1.0e-3

[AutodiffTransportSystem]

uL = [0.0]
isLowerDirichlet = false
uR = [0.3]
isUpperDirichlet = true

InitialHeights = [0.3]
InitialProfile = ["Uniform"]

[ADTestProblem]

kappa = 1.0
