# AuxVarADTest: the same reaction-diffusion problem as AuxVarTest.conf, but
# written on AutodiffTransportSystem so that every derivative -- including the
# auxiliary variable's own Jacobian and the source's dependence on it -- is
# obtained by automatic differentiation rather than by hand.
#
#     d_t u - kappa d_xx u = a + f(x),   a = u^2,   f = -kappa U'' - U^2
#
# with U = cos(pi x / 2), so the steady state is exactly u = U on [-1, 1] and
# TestSolutions.py checks it against that closed form rather than only against a
# reference of its own making.
#
# Why it is here at all: nothing in the tree drove the auxiliary path through the
# autodiff layer, and that is how AutodiffTransportSystem came to be missing its
# dSigma_dPhi override entirely -- every case built on it with nAux > 0 threw
# "nAux > 0 but no coupling to fluxes provided" as soon as the Jacobian was
# assembled, so AuxVarADTest had never run. It was the only such case and it was
# not in this suite.
#
# t_final = 20, not the 5.0 Config/AuxVarADTest.conf uses: the approach to the
# steady state is exponential and 5.0 is not far enough along it for a closed-form
# comparison. Measured error against U, at these tolerances -- 8.8e-03 at t = 5,
# 7.5e-04 at 10, 4.7e-05 at 20, 2.3e-06 at 40. So this is two orders inside the
# suite's 5e-3 and the margin is relaxation, not luck.
#
# Tight enough that the reference pins a solution rather than a step sequence,
# for the reason AuxVarTest.conf gives. The closed-form comparison is against the
# final time, where what is left is distance from the steady state; but the
# reference comparison is at *every* output, and at the 1e-2 this case used to
# run at, its answer at t = 1 was 1.46% from converged -- three times the 5e-3
# the suite compares at. So any change to the Newton path or the error weights
# moved it past the threshold without either answer being wrong: under
# ErrorWeights = "AlgebraicMax" the t = 1 answer is 0.49% from converged and
# failed against a reference made under "Pointwise". At 1e-6/1e-8 both schemes
# are within 8.4e-7 of a rtol = 1e-10 run at every output.
#
# MinStepSize is not decoration: at the default 1e-7 this case dies on its first
# step at these tolerances, the same floor AuxVarTest.conf records.

[configuration]
restart = false
TransportSystem = "AuxVarADTest"

PolynomialDegree = 4
GridSize = 20
LowerBoundary =  -1.0
UpperBoundary =   1.0
t_final = 20.0
delta_t = 1.0

Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-8
MinStepSize = 1.0e-12

[DiffusionProblem]

Centre = 0.0
Kappa = 1.0
