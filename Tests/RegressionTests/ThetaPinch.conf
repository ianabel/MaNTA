# The registered field model: a diamagnetic theta pinch in a flux-conserving
# wall (ThetaPinchEquilibrium), read by isothermal density transport on the
# flux label (ThetaPinchDiffusion). See docs/field_coupling.rst.
#
# The pressure is high enough that the field is far from vacuum -- B on axis
# falls to about 0.9 of the wall's -- so the reference pins the coupling and not
# just the transport. FieldSolve is the default, iterative; exact gives the
# same output to 1e-12.
[configuration]
TransportSystem = "ThetaPinchDiffusion"
FieldModel = "ThetaPinchEquilibrium"

PolynomialDegree = 4
GridSize = 8
LowerBoundary = 0.0
UpperBoundary = 1.0
t_final = 1.0
delta_t = 0.1
Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-8
MinStepSize = 1.0e-12

[ThetaPinchEquilibrium]
IntervalsPerCell = 2
PressureAux = 0

[ThetaPinchDiffusion]
Temperature = 0.3
D0 = 0.5
Gamma = 2.0
