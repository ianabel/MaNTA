[configuration]

# The resolution PERFORMANCE.md targets: few cells, moderate order.
PolynomialDegree = 4
GridSize = 4
LowerBoundary = 0.0
UpperBoundary = 1.0

# The steady state is what this benchmark is about, so the run relaxes onto it
# and stops. Presence of SteadyStateTolerance is what arms that; t_final is the
# backstop, and is required of a config file whether or not it is reached.
t_final = 1.0e4
delta_t = 1.0e3
SteadyStateTolerance = 1.0e-11

Relative_tolerance = 1.0e-6
# Absolute_tolerance is load-bearing here and is deliberately loose. IDA never
# calls IDASetSuppressAlg, so sigma, q and lambda are all in its error test, and
# an atol at or below 1e-7 makes this problem fail on the first step with
# IDA_ERR_FAIL (-3) at every resolution. It costs nothing: the error is set by
# the mesh, not by the tolerance -- see README.md.
Absolute_tolerance = 1.0e-3

PythonModuleName = "park_convergence"
PythonModuleFile = "park_convergence.py"
TransportSystem = "ParkConvergence"
