[configuration]

PolynomialDegree = 3
GridSize = 8
LowerBoundary = 0.0
UpperBoundary = 1.0

# Relax onto the steady state and stop. Presence of SteadyStateTolerance arms
# that; t_final is the backstop, and is required of a config file either way.
t_final = 1.0e4
delta_t = 1.0e3
SteadyStateTolerance = 1.0e-11
SteadyStateSolver = "Newton"

Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-3

PythonModuleName = "thermodiffusive_pinch"
PythonModuleFile = "thermodiffusive_pinch.py"
TransportSystem = "ThermodiffusivePinch"
