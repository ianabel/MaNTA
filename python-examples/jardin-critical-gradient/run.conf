[configuration]

# The resolution PERFORMANCE.md targets: few cells, moderate order.
PolynomialDegree = 3
GridSize = 10
LowerBoundary = 0.0
UpperBoundary = 1.0

# The stiff steady state is what this benchmark is about, so the run relaxes
# onto it and stops. Presence of SteadyStateTolerance is what arms that;
# t_final is the backstop, and is required of a config file either way.
t_final = 1.0e4
delta_t = 1.0e3
SteadyStateTolerance = 1.0e-11

Relative_tolerance = 1.0e-6
# Deliberately loose -- see ../park-convergence/run.conf for why. Anything at or
# below 1e-7 fails on the first step with IDA_ERR_FAIL (-3), and it buys nothing:
# the answer here is unchanged across four decades of Relative_tolerance.
Absolute_tolerance = 1.0e-3

PythonModuleName = "jardin_critical_gradient"
PythonModuleFile = "jardin_critical_gradient.py"
TransportSystem = "JardinCriticalGradient"
