[configuration]

# The resolution PERFORMANCE.md targets: few cells, moderate order. The exact
# solution carries an x^(4/3) at the axis and a kink where the source step
# ends, so its regularity -- not the scheme -- caps the order here. Grid_size
# is 10 so that a cell boundary falls on the source edge at x = 0.1.
Polynomial_degree = 2
Grid_size = 10
Lower_boundary = 0.0
Upper_boundary = 1.0

t_final = 1.0e3
delta_t = 1.0e3
SteadyStateTolerance = 1.0e-11

Relative_tolerance = 1.0e-6
Absolute_tolerance = 1.0e-3

# Load-bearing *for the initial condition this case uses*, at its
# BOUNDARY_DENSITY of 0.01. sigma_hat = D0 q^3/u^2 grows without bound as the
# wall density falls, and sigma is in IDA's local error test, so the step dies
# in the error test however small it gets. Taking the algebraic rows out of that
# test is what admits the problem -- at the cost of restart fidelity and, where
# nAux > 0, of the aux variables.
#
# The qualification is measured, not hedging: the case's initial condition is
# 1080x too large in sigma_hat near the wall because its amplitude is set by
# n(0) = 1 rather than by the physics, and correcting that alone makes the
# problem run with this key false at every n_b >= 1e-3. It is left as it is
# because the benchmark exists to record what MaNTA does on Shestakov's problem
# rather than to be tuned for it -- and because the badly scaled start is also
# the only one that reaches his n_b = 0 at all. ANALYSIS.md sections 1-4 have
# the numbers; docs/running.rst has what the key costs.
SuppressAlgebraicError = true

# TimeMarch, against the default. This is the one benchmark of the three that
# pseudo-transient continuation makes *worse*: 705 physics visits per point
# against time marching's 283, for the same answer. The flux D0 q^3/u^2 is
# degenerate, and the alpha/dt mass term that continuation exists to shed is
# what was damping it -- so as dt grows the inner Newton starts rejecting steps
# and the continuation spends its iterations backing off. Park's benchmark goes
# the other way, 113 visits to 19. Recorded rather than hidden; see README.md.
SteadyStateSolver = "TimeMarch"

PythonModuleName = "shestakov_nonlinear"
PythonModuleFile = "shestakov_nonlinear.py"
TransportSystem = "ShestakovNonlinear"
