; Type checking for the `manta` package.
;
; Scoped to python/manta deliberately. The rest of python/ is drivers, JAX
; experiments and test fixtures that were never written against annotations;
; turning mypy loose on them would produce a wall of findings that nobody acts
; on, which is how a check stops being read. The package is the part that ships
; and the part an out-of-tree case is written against, so it is the part whose
; stubs have to be true.
;
; Widen this when a directory is ready, not before.

[mypy]
; Deliberately unpinned: mypy then follows the interpreter it runs under.
; Pinning it to the project's floor (3.11) makes mypy read the *installed*
; numpy stubs as if on 3.11, and a current numpy uses `type` statements that
; only parse on 3.12+ -- so the pin fails on a syntax error inside numpy that
; has nothing to do with this project.
files = python/manta
mypy_path = python

; The stubs exist to be checked against the implementation, so a stub that
; contradicts __init__.py should fail rather than be ignored.
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_reexport = False

; Physics cases are ordinary unannotated Python, and mypy skips unannotated
; defs by default -- which would make the hook signatures in __init__.pyi
; decorative. With this on, a case whose SigmaFn is missing its `t` is an error
; without the author having to annotate anything.
check_untyped_defs = True

; _manta.pyi is generated. Holding generated output to the same standard as
; hand-written code means a pybind11-stubgen release could turn CI red for
; reasons that have nothing to do with the change under review.
[mypy-manta._manta]
ignore_errors = True
