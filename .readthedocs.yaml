# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py
   # Not fail_on_warning yet. `sphinx-build -W` is clean locally and is what the
   # docs are developed against, but the first Read the Docs build has never run,
   # and a warning that only appears there would publish nothing at all rather
   # than publishing with a warning. Turn this on once RTD is known green.
   # fail_on_warning: true

# Required, not optional: docs/requirements.txt is where sphinx-material comes
# from, and without it the build fails on `html_theme = "sphinx_material"` with
# the theme unavailable. Note this replaces the default Sphinx install, so
# docs/requirements.txt has to name Sphinx itself as well as the theme.
python:
   install:
   - requirements: docs/requirements.txt
