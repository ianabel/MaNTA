name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUNDIALS_VERSION: 7.5.0

jobs:
  # One job per compiler, because conformance bugs and gcc-specific flag
  # assumptions should be caught here rather than discovered by whoever next
  # builds without gcc. Two real issues turned up when clang was first added: a
  # dangling `else` in State.hpp, which gcc could not report at the time because
  # -Wno-parentheses was applied globally and on gcc that takes -Wdangling-else
  # with it -- that suppression is gone as of 283b9a3, so -Wall catches it on
  # either compiler now -- and MagneticField's missing virtual destructor, which
  # only clang diagnoses at all.
  #
  # Every leg runs the full suite, not just the build. Two reasons that matters
  # beyond compiling clean:
  #   - the regression suite compares against .ref.nc files generated by gcc, so
  #     running it under clang doubles as a cross-compiler check that the
  #     numerics agree;
  #   - the pybind11 build is the only translation unit that pulls in Eigen's
  #     SparseCore, which is where -isystem-versus-I mistakes and clang-only
  #     warnings surface (see CLAUDE.md). Building the _manta target is the step
  #     that finds those, so it has to run everywhere.
  #
  # fail-fast is off on purpose: when one compiler breaks, the others' results
  # are exactly what tells you whether it is a real bug or that compiler's
  # opinion. Several legs can also fail for reasons that have nothing to do with
  # this code, because what they need comes from outside the runner image: g++-15
  # and g++-16 from the toolchain PPA, clang++-21 from apt.llvm.org, and both
  # Eigen 5 legs from gitlab.
  #
  # g++-16, clang++-19 and clang++-21 were each verified by hand -- full build,
  # both C++ suites, the pybind11 module and the Python suite -- before being added
  # here. g++-15 and clang++-20 were not, because neither is packaged for the
  # Debian box this was written on, so CI is their first real run.
  #
  # Read that claim narrowly. A local clang build is NOT the same test as the clang
  # legs here, because the standard library differs: clang picks the newest GCC
  # installation on the box, and these legs get the runner image's, which on
  # ubuntu-24.04 is libstdc++ 14 (14.2.0) -- only the g++-15 leg adds the toolchain
  # PPA. That gap is not hypothetical. clang++-21 passed by hand against libstdc++
  # 15 and then failed here on three std::bind_front conversions that libstdc++
  # rejects before 14.4; see the comment in SystemSolver::setInitialConditions.
  # Testing against the *older* library is the point -- it is what finds this
  # class of bug -- so do not "fix" a leg by pulling in a newer libstdc++.
  #
  # The matrix has a second, sparse dimension: `eigen`. Unset means the distro's
  # libeigen3-dev, which on noble is 3.4.0; set means that tagged release is
  # fetched from gitlab and EIGEN_DIR points at it. MaNTA supports 3.4.x and
  # 5.0.x, and the two differ enough to need guarding -- Eigen::all moved
  # namespace and internal::SingleRange became a template -- but the difference is
  # in Eigen, not in the compiler -- so it gets two legs, one per compiler family,
  # rather than a full cross product. If those fail while the others pass, Eigen is
  # the variable.
  #
  # `label` exists so adding those legs does not rename the existing ones: the job
  # name is part of a required-check name, and legs whose name changes stop
  # counting as the check they used to be. **A leg added, dropped or relabelled
  # here changes the set of contexts published, so the branch-protection required
  # list has to be updated in the same change** -- a required context that nothing
  # publishes never arrives and blocks every non-admin silently. CLAUDE.md has the
  # two-command diff for checking the rule and the run agree.
  build-and-test:
    name: Build + tests (${{ matrix.label || matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two older compilers were measured. Only one of them is impossible:
          #   g++-13     -- libstdc++-13 has no <print>, and ten files use
          #                 std::print, so it fails at the first #include. Nothing
          #                 short of not using std::print would change that.
          #   clang++-18 -- used to fail on PyGrid.hpp's `constexpr Vector
          #                 getNodes(...)`, a constexpr function returning a
          #                 non-literal type, which C++23 allows under P2448R2 but
          #                 clang 18 does not implement. That constexpr was
          #                 decorative and is now `inline`, so clang++-18 builds and
          #                 passes all three suites as of that change. It is
          #                 deliberately *not* a leg here: adding it would commit
          #                 the project to clang-18 -Werror compliance, and P2448R2
          #                 was only the first C++23 gap. It is verified, not
          #                 guarded -- expect it to rot.
          # g++-14 is deliberately absent. It miscompiles this tree at the release
          # flags -- -O3 -flto -march=native, all three required -- and the symptom
          # is a wrong number rather than a diagnostic: adding any member to
          # SystemSolver makes the AuxDiffusion cases of
          # the_assembled_jacobian_matches_a_finite_difference_of_the_residual fail
          # about half their runs. See CLAUDE.md and TODO. A leg that fails half the
          # time for reasons unrelated to the change under review is worse than no
          # leg, so it is gone rather than marked flaky, and noble's archive
          # compiler is therefore *not* covered here. That is a real gap: the
          # nearest thing to it is the Fedora container job, which only compiles.
          #
          # Not in the noble archive (which stops at g++-14), so these two legs need
          # the toolchain PPA -- g++-15 there is 15.2.0-14ubuntu1~24~ppa1 and
          # g++-16 is 16-20260315-1ubuntu1~24~ppa1, a snapshot rather than a
          # release. g++-16 is the compiler this tree is developed against, so it
          # is the one leg where a warning that only the newest gcc emits will be
          # found by CI rather than by whoever next runs a local build.
          - cxx: g++-15
            pkg: g++-15
            ppa: ubuntu-toolchain-r/test
          # ...and this one builds with MANTA_LAPACK=OFF, so the built-in banded
          # factorisation is what the whole suite runs against on one leg rather
          # than only in the utility_tests cases that call it directly. The two
          # give the same answers; that is the claim being tested.
          - cxx: g++-16
            pkg: g++-16
            ppa: ubuntu-toolchain-r/test
            lapack: 'OFF' 
          # The ubuntu-24.04 image itself carries only clang 16/17/18, but noble's
          # universe repo packages clang-19 (1:19.1.1) and clang-20 (1:20.1.2), so
          # these two legs need nothing but apt.
          - cxx: clang++-19
            pkg: clang-19
          - cxx: clang++-20
            pkg: clang-20
          # clang-21 is not in the noble archive at any version, so this leg has to
          # reach outside for its compiler.
          - cxx: clang++-21
            pkg: clang-21
            llvm_version: '21'
          # The Eigen 5 legs. Two rather than one, and on one compiler of each
          # family: with g++-14 gone the "vary Eigen and nothing else" leg lost the
          # baseline it was comparable against, and Eigen 5 is where the two
          # compilers are most likely to disagree -- the differences MaNTA guards
          # are template and namespace changes (Eigen::all moved,
          # internal::SingleRange became a template), which is exactly the kind of
          # thing one front end accepts and the other does not. Each has a plain
          # counterpart above at the same compiler, so a failure here still isolates
          # to Eigen.
          #
          # Pinned to the 5.0.1 tag rather than a branch, so the legs do not start
          # failing because upstream master moved.
          - cxx: g++-15
            pkg: g++-15
            ppa: ubuntu-toolchain-r/test
            eigen: 5.0.1
            label: g++-15, Eigen 5.0.1
          - cxx: clang++-19
            pkg: clang-19
            eigen: 5.0.1
            label: clang++-19, Eigen 5.0.1
          # The OpenMP leg. One is enough -- what it guards is MaNTA's own code,
          # not a front-end difference -- and it exists because until 2026-08-25
          # *nothing* built with MANTA_OPENMP=ON, so the pragmas had never been
          # compiled with -fopenmp by anything automated. What that hid: an
          # exception thrown by a physics hook inside a parallel loop aborted the
          # process, because gcc's outlined function has no handler above it and
          # __cxa_call_terminate runs. It killed the whole unit suite, and MaNTA
          # treats a throwing hook as a *supported* recoverable error.
          #
          # util/ParallelFor.hpp fixed it and utility_tests pins it, but those
          # cases only bite in a build that sets the option -- which is what this
          # leg is for. See CLAUDE.md, "Parallelism".
          - cxx: g++-15
            pkg: g++-15
            ppa: ubuntu-toolchain-r/test
            openmp: 'ON'
            omp_threads: 4
            label: g++-15, OpenMP
    # OMP_NUM_THREADS reaches more than MaNTA: -fopenmp loads libgomp, and that
    # alone is enough for a dispatching BLAS to start threading itself, which
    # changes floating-point reduction order. On a box whose libblas.so.3 is
    # libmkl_rt that was enough to fail a tight-tolerance IDACalcIC test in a
    # build where none of MaNTA's own loops were even parallel. The runner's
    # libblas-dev is reference BLAS and single-threaded, so these two pins are a
    # no-op here -- they are set so the leg keeps meaning "MaNTA's threading" if
    # the image's BLAS ever changes.
    env:
      OMP_NUM_THREADS: ${{ matrix.omp_threads || 1 }}
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only for legs whose compiler the runner image does not carry. An absent
      # matrix key is null, and a GitHub expression casts both null and '' to 0
      # when comparing across types, so the condition is false -- and the step
      # skipped -- for the image-provided compilers.
      - name: Add the toolchain PPA
        if: matrix.ppa != ''
        run: |
          # add-apt-repository ships in software-properties-common, which is not on
          # the ubuntu-24.04 image's apt package list -- install it rather than
          # assume it is there.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:${{ matrix.ppa }}

      - name: Add the LLVM apt repository
        if: matrix.llvm_version != ''
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          # From os-release rather than `lsb_release -cs`, which is a package that
          # happens to be on the image rather than something guaranteed to be.
          . /etc/os-release
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-${{ matrix.llvm_version }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.pkg }} cmake wget \
            libboost-dev \
            libeigen3-dev \
            libnetcdf-dev libnetcdf-c++4-dev \
            libblas-dev liblapack-dev

      # Boost.Test is used in header-only mode (boost/test/included/unit_test.hpp),
      # so libboost-dev alone is enough -- no unit_test_framework link step.

      # One cache key for every leg, including the coverage job below.
      # build_sundials does not pass CMAKE_C_COMPILER, so the install is built
      # with the image's default cc no matter which compiler this leg uses; and
      # SUNDIALS is a C library MaNTA only links against. Whichever job runs
      # first populates it, and the losers of that race just restore it.
      #
      # The key hashes build_sundials, so changing *what* is built invalidates
      # every cache that predates the change. The version alone is not enough:
      # turning on a solver MaNTA had started linking left every leg restoring
      # an install that did not have it, and the flag change then looked like it
      # had no effect at all -- the "Build SUNDIALS" step is skipped on a hit, so
      # nothing reruns cmake to notice. hashFiles keeps that from recurring
      # without anyone having to remember to bump a key by hand.
      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ runner.os }}-cc-default-${{ hashFiles('build_sundials') }}

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      # Only for a leg that names an `eigen` version; the rest use libeigen3-dev,
      # installed above. Header-only, so this is a download and an untar rather
      # than a build, and not worth caching.
      #
      # The tag is checked after unpacking. A wrong or moved tag would otherwise
      # give a perfectly green leg that silently tested the version it was meant
      # to be an alternative to, which is the one failure this leg cannot afford.
      - name: Install Eigen ${{ matrix.eigen }}
        if: matrix.eigen != ''
        run: |
          wget -q "https://gitlab.com/libeigen/eigen/-/archive/${{ matrix.eigen }}/eigen-${{ matrix.eigen }}.tar.gz"
          tar xzf "eigen-${{ matrix.eigen }}.tar.gz"
          dir="$PWD/eigen-${{ matrix.eigen }}"
          got=$(sed -n 's/^#define EIGEN_VERSION_STRING "\(.*\)"$/\1/p' "$dir/Eigen/Version")
          if [ "$got" != "${{ matrix.eigen }}" ]; then
            echo "::error::unpacked Eigen reports '$got', expected '${{ matrix.eigen }}'"
            exit 1
          fi
          echo "Eigen $got in $dir"
          echo "EIGEN_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Everything machine-specific is on this one command line. There is no
      # Makefile.local any more, and CMakeUserPresets.json is for a developer's
      # own box rather than for CI.
      #
      # Python3_EXECUTABLE is passed explicitly rather than left to FindPython3.
      # setup-python's interpreter is first on PATH, but FindPython3 has its own
      # search order and is free to prefer /usr/bin/python3 -- which would build
      # the extension for one interpreter and run pytest under another. That is
      # the ABI mismatch the old PYTHON_CONFIG logic existed to avoid, and it is
      # worth a line to make impossible rather than likely.
      #
      # MANTA_EIGEN_INCLUDE_DIR is set only on the Eigen 5 legs. The step above
      # unpacks a source tarball, which carries Eigen3Config.cmake.in but no
      # generated Eigen3Config.cmake, so find_package cannot see it however the
      # path is spelled. Every other leg leaves EIGEN_DIR unset and gets
      # libeigen3-dev through find_package with nothing configured.
      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DSUNDIALS_ROOT="$PWD/sundials/install" \
            -DPython3_EXECUTABLE="$(which python)" \
            -DMANTA_OPENMP=${{ matrix.openmp || 'OFF' }} \
            -DMANTA_LAPACK=${{ matrix.lapack || 'ON' }} \
            ${EIGEN_DIR:+-DMANTA_EIGEN_INCLUDE_DIR="$EIGEN_DIR"}

      # Three build steps rather than one `cmake --build build`, so a failure
      # still says which half of the tree broke. They share manta_objects, so the
      # first does most of the work and the other two are close to free.
      - name: Build solver
        run: cmake --build build --target MaNTA -j$(nproc)

      - name: Build unit tests
        run: cmake --build build --target UnitTests -j$(nproc)

      - name: Build Python module
        run: cmake --build build --target _manta -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build -R '^unit$' --output-on-failure

      - name: Regression tests
        run: ctest --test-dir build -R '^regression$' --output-on-failure

      - name: Python tests
        run: ctest --test-dir build -R '^python$' --output-on-failure

      # One leg only: neither the generated stub nor the type check varies by
      # compiler, and running them on every leg would just be several ways to learn
      # the same thing. The Eigen version is excluded too, not just the compiler --
      # g++-15 has two legs, and neither check varies by Eigen either. This used to
      # ride on g++-14, which is why it moved when that leg went; if g++-15 is ever
      # dropped, these two steps have to move again or they stop running at all,
      # silently.
      - name: Stubs are up to date
        if: matrix.cxx == 'g++-15' && matrix.eigen == ''
        run: cmake --build build --target stubs-check

      - name: Type check the manta package
        if: matrix.cxx == 'g++-15' && matrix.eigen == ''
        run: cmake --build build --target typecheck

      # Naming a prefix the compiler already searches must be a no-op. Under the
      # Makefile it was not: -isystem /usr/include makes gcc and clang drop
      # /usr/include from the end of the system chain and search it ahead of the
      # libstdc++ headers, so <cstdlib>'s `#include_next <stdlib.h>` finds nothing
      # and every translation unit fails. Makefile.config carried a compiler probe
      # and a hand-written filter for exactly that.
      #
      # CMake does the filtering itself, by stripping
      # CMAKE_CXX_IMPLICIT_INCLUDE_DIRECTORIES from the flags it generates. That is
      # a claim worth testing rather than trusting, so the check stays -- rewritten
      # against a scratch build directory configured with a system prefix, reading
      # the compile lines CMake actually emitted rather than a dry run.
      #
      # Every leg, not one: the implicit-directory list comes from a compiler probe
      # whose output format differs between gcc and clang, so it has to be
      # exercised on both. A separate build directory, so the real one is untouched.
      - name: A system prefix is a no-op
        run: |
          cmake -B build-sysprefix -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DSUNDIALS_ROOT="$PWD/sundials/install" \
            -DPython3_EXECUTABLE="$(which python)" \
            -DCMAKE_PREFIX_PATH=/usr > /dev/null
          if grep -E -- '-isystem /usr/include[" ]' build-sysprefix/compile_commands.json; then
            echo "::error::a /usr prefix put /usr/include on the compile line as -isystem"
            exit 1
          fi
          # And that a translation unit still compiles with that prefix in play,
          # which is where the old failure actually surfaced. One object, not the
          # whole target: `Config.o` is a per-source target the Unix Makefiles
          # generator emits (Ninja spells it `Config.cpp.o`), and this job uses
          # the default generator. It is the direct successor to the old
          # `make Config.o NETCDF_DIR=/usr`.
          cmake --build build-sysprefix --target Config.o > /dev/null
          rm -rf build-sysprefix

  # A non-Debian distro, in a container, to check that the build's assumptions about
  # where a system installation puts things are actually assumptions about POSIX and
  # not about Ubuntu. Two are worth naming:
  #
  #   - Fedora puts libraries in /usr/lib64. Makefile.config used to choose lib or
  #     lib64 by hand, testing which one held the library; find_package and
  #     pkg-config do that now. This is still the only leg that exercises the
  #     lib64 side of it -- every other one is multiarch Debian.
  #   - netCDF is found through pkg-config here, with NETCDF_DIR unset, and the
  #     Fedora .pc files are laid out differently from noble's.
  #
  # This job used to compile and stop, on the argument that running the numerics
  # would add failure modes -- a differently-tuned BLAS, say -- that say nothing
  # about whether the *configuration* is Debian-specific. It runs the suites now,
  # in two legs, and the argument it replaces is worth keeping in view: if this
  # ever fails on a numerical tolerance rather than on a build or a link, that is
  # the predicted noise and not a Fedora bug. The pins in `env` below are what
  # keep the BLAS out of it.
  #
  # Two legs, differing only in MANTA_OPENMP. Both are wanted here rather than on
  # the ubuntu matrix alone because this is the one image whose libgomp, libstdc++
  # and BLAS are not the runner's, and OpenMP is where those three interact: the
  # threading defect that util/ParallelFor.hpp fixed was an interaction between
  # gcc's outlined function and an exception, which is a toolchain property rather
  # than a MaNTA one.
  #
  # _manta is built on both legs because it is the only translation unit that pulls
  # in Eigen's SparseCore, which is where -isystem mistakes surface (see CLAUDE.md).
  #
  # This is a separate job rather than another entry in build-and-test because it
  # shares almost none of that job's steps: dnf rather than apt, no sudo, no
  # setup-python, and git has to exist *before* actions/checkout or the submodules
  # are silently skipped. It carries its own matrix so a second distro is one line.
  distro-build-and-test:
    name: Build + tests (${{ matrix.label || matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
          - image: fedora:latest
            openmp: 'ON'
            omp_threads: 4
            label: 'fedora:latest, OpenMP'
    container: ${{ matrix.image }}
    # As on the ubuntu OpenMP leg: -fopenmp loads libgomp, and that alone is enough
    # for a dispatching BLAS to start threading itself and change reduction order.
    # Fedora's BLAS is not the runner's, so unlike there these are not a no-op that
    # documents an intention -- they are the thing that keeps a failure here
    # meaning "MaNTA's threading" rather than "Fedora's libblas".
    env:
      OMP_NUM_THREADS: ${{ matrix.omp_threads || 1 }}
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      # Before the checkout, and the reason this job cannot just reuse the matrix
      # above. actions/checkout falls back to downloading a tarball through the REST
      # API when git is missing, and that path cannot fetch submodules -- so the
      # build would fail much later, on a missing toml11 header, with nothing
      # pointing at the real cause.
      - name: Install git, so the checkout can fetch submodules
        run: dnf -y install --setopt=install_weak_deps=False git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc-c++ cmake wget tar gzip \
            boost-devel \
            eigen3-devel \
            netcdf-devel netcdf-cxx4-devel \
            blas-devel lapack-devel \
            python3-devel python3-pip
          # Diagnostics only -- which Eigen Fedora shipped is the interesting
          # part, and it moved header between 3.4 and 5.0. `|| true` because run
          # steps use `bash -e` and grep exits non-zero on no match, which would
          # fail the step over a log line.
          echo "--- versions ---"
          g++ --version | head -1
          python3 --version
          grep -rhE 'define EIGEN_(WORLD|MAJOR|MINOR|PATCH)_VERSION' \
            /usr/include/eigen3/Eigen/src/Core/util/Macros.h \
            /usr/include/eigen3/Eigen/Version 2>/dev/null || true

      # The suites need the same packages the ubuntu legs install. This is the one
      # leg where the interpreter is the image's rather than setup-python's, so the
      # Python version moves when Fedora's does -- and a requirements.txt pin with
      # no wheel for that version fails here first. That is a real risk and it is
      # deliberate: it is the same class of thing this job exists to find.
      - name: Install Python dependencies
        run: |
          # A venv rather than `pip install` into the image's Python. Fedora marks
          # its system interpreter externally-managed (PEP 668), so installing into
          # it fails outright unless overridden -- and a venv in the repo root is
          # what CMake looks for first anyway, so this is the configuration a
          # developer on this distro would have.
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python --version

      # A key of its own: this SUNDIALS is built in a Fedora container against a
      # different libc and libstdc++ from the ubuntu legs', and the two must not
      # restore each other's. Hashed on build_sundials for the reason given on
      # the ubuntu leg's key. Both legs of this job share it -- same image, same
      # compiler, and MANTA_OPENMP does not reach SUNDIALS.
      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ matrix.image }}-${{ hashFiles('build_sundials') }}

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      # Nothing named for netCDF or Eigen, deliberately. Both are package-manager
      # installs here, so netCDF goes through pkg-config and Eigen through the
      # Eigen3Config.cmake that eigen3-devel ships -- which is the configuration
      # this job exists to check, since Fedora lays both out differently from
      # noble and puts its libraries in lib64.
      #
      # Python3_EXECUTABLE is pinned for the reason the ubuntu legs pin it: the
      # extension must be built for the interpreter that will import it, and
      # FindPython3 is free to prefer a different one.
      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMANTA_OPENMP=${{ matrix.openmp || 'OFF' }} \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DSUNDIALS_ROOT="$PWD/sundials/install"

      # Three build steps rather than one, so a failure still says which half of
      # the tree broke. They share manta_objects, so the first does most of the
      # work and the other two are close to free.
      - name: Build solver
        run: cmake --build build --target MaNTA -j$(nproc)

      - name: Build unit tests
        run: cmake --build build --target UnitTests -j$(nproc)

      - name: Build Python module
        run: cmake --build build --target _manta -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build -R '^unit$' --output-on-failure

      - name: Regression tests
        run: ctest --test-dir build -R '^regression$' --output-on-failure

      - name: Python tests
        run: ctest --test-dir build -R '^python$' --output-on-failure


  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # g++-15 from the toolchain PPA, like the build legs: g++-14 is not used
      # anywhere in this workflow any more (see the matrix above). This job is at
      # -O0 --coverage with neither LTO nor -march=native, so it was never exposed
      # to the g++-14 miscompile -- it moves for consistency and so that no part of
      # CI is left resting on that compiler.
      #
      # cmake/MantaCompilerFlags.cmake derives MANTA_GCOV from the compiler's
      # VERSION, so this also makes it gcov-15. That coupling is load-bearing:
      # gcovr must read .gcno/.gcda with the same toolchain version that wrote
      # them, or it exits 3 with a version-mismatch error that looks nothing like
      # a coverage problem. This image's default gcov is 13.
      - name: Add the toolchain PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-15 cmake wget \
            libboost-dev \
            libeigen3-dev \
            libnetcdf-dev libnetcdf-c++4-dev \
            libblas-dev liblapack-dev

      # Shares the build legs' key deliberately -- same image, same install.
      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ runner.os }}-cc-default-${{ hashFiles('build_sundials') }}

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt gcovr

      # A build directory of its own, with CMAKE_BUILD_TYPE=Coverage. Under the
      # Makefile this was one tree that recursed with COVERAGE=on, which needed
      # `env -u CXXFLAGS -u LDFLAGS` to stop the parent's release flags leaking
      # into the child -- -O0 won, but -flto=auto survived and silently ruined
      # line attribution -- and ended with a `make clean` so the tree was left
      # buildable afterwards. Separate directories make both unnecessary: there is
      # no parent to inherit from, and nothing to undo.
      - name: Configure
        run: |
          cmake -B build-coverage -S . \
            -DCMAKE_BUILD_TYPE=Coverage \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DSUNDIALS_ROOT="$PWD/sundials/install" \
            -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build-coverage -j$(nproc)

      - name: Run coverage
        run: cmake --build build-coverage --target coverage

      - name: Summarise
        if: always()
        run: |
          # Guarded because this step runs on always(). Without the guard a failed
          # coverage step is followed by `tail: cannot open ...: No such file or
          # directory`, and that becomes the *last* error in the log -- burying the
          # real one several hundred lines up.
          if [ ! -f build-coverage/coverage/summary.txt ]; then
            echo 'Coverage report not produced -- see the "Run coverage" step.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Coverage (in-scope: numerical core + Python bindings)'
            echo '```'
            tail -n 40 build-coverage/coverage/summary.txt
            echo '```'
            echo '### PhysicsCases (informational)'
            echo '```'
            # That report comes from a `-`-prefixed gcovr in the coverage target,
            # so it is allowed to be absent while the in-scope one succeeded.
            tail -n 20 build-coverage/coverage/physics.txt 2>/dev/null || echo '(not produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage/
