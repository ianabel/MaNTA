name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUNDIALS_VERSION: 7.5.0

jobs:
  # One job per compiler, because conformance bugs and gcc-specific flag
  # assumptions should be caught here rather than discovered by whoever next
  # builds without gcc. Two real issues turned up when clang was first added: a
  # dangling `else` in State.hpp, which gcc could not report at the time because
  # -Wno-parentheses was applied globally and on gcc that takes -Wdangling-else
  # with it -- that suppression is gone as of 283b9a3, so -Wall catches it on
  # either compiler now -- and MagneticField's missing virtual destructor, which
  # only clang diagnoses at all.
  #
  # Every leg runs the full suite, not just the build. Two reasons that matters
  # beyond compiling clean:
  #   - the regression suite compares against .ref.nc files generated by gcc, so
  #     running it under clang doubles as a cross-compiler check that the
  #     numerics agree;
  #   - the pybind11 build is the only translation unit that pulls in Eigen's
  #     SparseCore, which is where -isystem-versus-I mistakes and clang-only
  #     warnings surface (see CLAUDE.md). `make python` is the step that finds
  #     those, so it has to run everywhere.
  #
  # fail-fast is off on purpose: when one compiler breaks, the others' results
  # are exactly what tells you whether it is a real bug or that compiler's
  # opinion. Three legs can also fail for reasons that have nothing to do with this
  # code, because their compiler comes from outside the runner image: g++-15 and
  # g++-16 from the toolchain PPA, and clang++-21 from apt.llvm.org. The Eigen 5 leg
  # makes four, for the same reason one step down: its Eigen comes from gitlab.
  #
  # g++-14, g++-16, clang++-19 and clang++-21 were each verified by hand --
  # full build, both C++ suites, the pybind11 module and the Python suite -- before
  # being added here. g++-15 and clang++-20 were not, because neither is packaged
  # for the Debian box this was written on, so CI is their first real run.
  #
  # Read that claim narrowly. A local clang build is NOT the same test as the clang
  # legs here, because the standard library differs: clang picks the newest GCC
  # installation on the box, and these legs get the runner image's, which on
  # ubuntu-24.04 is libstdc++ 14 (14.2.0) -- only the g++-15 leg adds the toolchain
  # PPA. That gap is not hypothetical. clang++-21 passed by hand against libstdc++
  # 15 and then failed here on three std::bind_front conversions that libstdc++
  # rejects before 14.4; see the comment in SystemSolver::setInitialConditions.
  # Testing against the *older* library is the point -- it is what finds this
  # class of bug -- so do not "fix" a leg by pulling in a newer libstdc++.
  #
  # The matrix has a second, sparse dimension: `eigen`. Unset means the distro's
  # libeigen3-dev, which on noble is 3.4.0; set means that tagged release is
  # fetched from gitlab and EIGEN_DIR points at it. MaNTA supports 3.4.x and
  # 5.0.x, and the two differ enough to need guarding -- Eigen::all moved
  # namespace and internal::SingleRange became a template -- but the difference is
  # in Eigen, not in the compiler, so it gets *one* leg rather than a full cross
  # product. If that leg fails while the others pass, Eigen is the variable.
  #
  # `label` exists so adding that leg does not rename the existing ones: the job
  # name is part of a required-check name, and legs whose name changes stop
  # counting as the check they used to be.
  build-and-test:
    name: Build + tests (${{ matrix.label || matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two older compilers were measured. Only one of them is impossible:
          #   g++-13     -- libstdc++-13 has no <print>, and ten files use
          #                 std::print, so it fails at the first #include. Nothing
          #                 short of not using std::print would change that.
          #   clang++-18 -- used to fail on PyGrid.hpp's `constexpr Vector
          #                 getNodes(...)`, a constexpr function returning a
          #                 non-literal type, which C++23 allows under P2448R2 but
          #                 clang 18 does not implement. That constexpr was
          #                 decorative and is now `inline`, so clang++-18 builds and
          #                 passes all three suites as of that change. It is
          #                 deliberately *not* a leg here: adding it would commit
          #                 the project to clang-18 -Werror compliance, and P2448R2
          #                 was only the first C++23 gap. It is verified, not
          #                 guarded -- expect it to rot.
          - cxx: g++-14
            pkg: g++-14
          # Not in the noble archive (which stops at g++-14), so these two legs need
          # the toolchain PPA -- g++-15 there is 15.2.0-14ubuntu1~24~ppa1 and
          # g++-16 is 16-20260315-1ubuntu1~24~ppa1, a snapshot rather than a
          # release. g++-16 is the compiler this tree is developed against, so it
          # is the one leg where a warning that only the newest gcc emits will be
          # found by CI rather than by whoever next runs a local build.
          - cxx: g++-15
            pkg: g++-15
            ppa: ubuntu-toolchain-r/test
          - cxx: g++-16
            pkg: g++-16
            ppa: ubuntu-toolchain-r/test
          # The ubuntu-24.04 image itself carries only clang 16/17/18, but noble's
          # universe repo packages clang-19 (1:19.1.1) and clang-20 (1:20.1.2), so
          # these two legs need nothing but apt.
          - cxx: clang++-19
            pkg: clang-19
          - cxx: clang++-20
            pkg: clang-20
          # clang-21 is not in the noble archive at any version, so this leg has to
          # reach outside for its compiler.
          - cxx: clang++-21
            pkg: clang-21
            llvm_version: '21'
          # The Eigen 5 leg. On the baseline compiler deliberately: this leg exists
          # to vary Eigen and nothing else, so g++-14 keeps it comparable with the
          # first leg above. Pinned to the 5.0.1 tag rather than a branch, so the
          # leg does not start failing because upstream master moved.
          - cxx: g++-14
            pkg: g++-14
            eigen: 5.0.1
            label: g++-14, Eigen 5.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only for legs whose compiler the runner image does not carry. An absent
      # matrix key is null, and a GitHub expression casts both null and '' to 0
      # when comparing across types, so the condition is false -- and the step
      # skipped -- for the image-provided compilers.
      - name: Add the toolchain PPA
        if: matrix.ppa != ''
        run: |
          # add-apt-repository ships in software-properties-common, which is not on
          # the ubuntu-24.04 image's apt package list -- install it rather than
          # assume it is there.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:${{ matrix.ppa }}

      - name: Add the LLVM apt repository
        if: matrix.llvm_version != ''
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          # From os-release rather than `lsb_release -cs`, which is a package that
          # happens to be on the image rather than something guaranteed to be.
          . /etc/os-release
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-${{ matrix.llvm_version }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.pkg }} cmake wget \
            libboost-dev \
            libeigen3-dev \
            libnetcdf-dev libnetcdf-c++4-dev \
            libblas-dev

      # Boost.Test is used in header-only mode (boost/test/included/unit_test.hpp),
      # so libboost-dev alone is enough -- no unit_test_framework link step.

      # One cache key for every leg, including the coverage job below.
      # build_sundials does not pass CMAKE_C_COMPILER, so the install is built
      # with the image's default cc no matter which compiler this leg uses; and
      # SUNDIALS is a C library MaNTA only links against. Whichever job runs
      # first populates it, and the losers of that race just restore it.
      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ runner.os }}-gcc14

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      # Only for a leg that names an `eigen` version; the rest use libeigen3-dev,
      # installed above. Header-only, so this is a download and an untar rather
      # than a build, and not worth caching.
      #
      # The tag is checked after unpacking. A wrong or moved tag would otherwise
      # give a perfectly green leg that silently tested the version it was meant
      # to be an alternative to, which is the one failure this leg cannot afford.
      - name: Install Eigen ${{ matrix.eigen }}
        if: matrix.eigen != ''
        run: |
          wget -q "https://gitlab.com/libeigen/eigen/-/archive/${{ matrix.eigen }}/eigen-${{ matrix.eigen }}.tar.gz"
          tar xzf "eigen-${{ matrix.eigen }}.tar.gz"
          dir="$PWD/eigen-${{ matrix.eigen }}"
          got=$(sed -n 's/^#define EIGEN_VERSION_STRING "\(.*\)"$/\1/p' "$dir/Eigen/Version")
          if [ "$got" != "${{ matrix.eigen }}" ]; then
            echo "::error::unpacked Eigen reports '$got', expected '${{ matrix.eigen }}'"
            exit 1
          fi
          echo "Eigen $got in $dir"
          echo "EIGEN_DIR=$dir" >> "$GITHUB_ENV"

      # Unquoted heredoc, so EIGEN_DIR from the step above is substituted; it falls
      # back to the distro headers for every other leg. matrix.cxx is expanded by
      # Actions before the shell ever sees it either way.
      - name: Configure Makefile.local
        run: |
          cat > Makefile.local <<EOF
          CXX = ${{ matrix.cxx }}
          SUNDIALS_DIR = ./sundials/install
          EIGEN_DIR = ${EIGEN_DIR:-/usr/include/eigen3}
          EOF
          cat Makefile.local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build solver
        run: make MaNTA -j$(nproc)

      - name: Unit tests
        run: make test

      - name: Regression tests
        run: make regression_tests

      - name: Build Python module
        run: make python -j$(nproc)

      - name: Python tests
        run: make python_tests

      # One leg only: neither the generated stub nor the type check varies by
      # compiler, and running them five times would just be five ways to learn
      # the same thing. The Eigen version is excluded too, not just the compiler --
      # there are two g++-14 legs now, and neither check varies by Eigen either.
      - name: Stubs are up to date
        if: matrix.cxx == 'g++-14' && matrix.eigen == ''
        run: make stubs-check

      - name: Type check the manta package
        if: matrix.cxx == 'g++-14' && matrix.eigen == ''
        run: make typecheck

      # Naming a prefix the compiler already searches must be a no-op. It was not:
      # -isystem /usr/include makes gcc and clang drop /usr/include from the end of
      # the system chain and search it ahead of the libstdc++ headers, so <cstdlib>'s
      # `#include_next <stdlib.h>` finds nothing and every translation unit fails.
      # The Makefile.local written above leaves NETCDF_DIR unset, which is the one
      # configuration where the bug is invisible -- hence this step.
      #
      # Every leg, not one: the filter is built from a compiler probe whose output
      # format differs between gcc and clang, so it has to be exercised on both.
      # NETCDF_DIR goes on the command line rather than into Makefile.local so the
      # rest of the configuration is untouched, and Config.o is removed either side
      # so no later step inherits it.
      - name: A system-prefix NETCDF_DIR is a no-op
        run: |
          rm -f Config.o
          if make -n MaNTA NETCDF_DIR=/usr | grep -E -- '-isystem /usr/include( |$)'; then
            echo "::error::NETCDF_DIR=/usr put /usr/include on the compile line as -isystem"
            exit 1
          fi
          make Config.o NETCDF_DIR=/usr
          rm -f Config.o

  # A non-Debian distro, in a container, to check that the build's assumptions about
  # where a system installation puts things are actually assumptions about POSIX and
  # not about Ubuntu. Two are worth naming:
  #
  #   - Fedora puts libraries in /usr/lib64. Makefile.config's `syslibdir` picks
  #     lib or lib64 by testing which one holds the library, and until now nothing
  #     exercised the lib64 side of that; every other leg is multiarch Debian.
  #   - netCDF is found through pkg-config here, with NETCDF_DIR unset, and the
  #     Fedora .pc files are laid out differently from noble's.
  #
  # Compilation only, deliberately -- `make MaNTA` and `make python`, no suites.
  # The point is to find configuration that is wrong outside Debian, and running
  # the numerics as well would add failure modes (a differently-tuned BLAS, say)
  # that say nothing about that. The other seven legs cover behaviour.
  #
  # `make python` is in scope because it is the only translation unit that pulls in
  # Eigen's SparseCore, which is where -isystem mistakes surface (see CLAUDE.md).
  #
  # This is a separate job rather than another entry in build-and-test because it
  # shares almost none of that job's steps: dnf rather than apt, no sudo, no
  # setup-python, and git has to exist *before* actions/checkout or the submodules
  # are silently skipped. It carries its own one-element matrix so a second distro
  # is one line.
  #
  # Unverified locally -- there is no container runtime on the box this was written
  # on -- so CI is its first real run, exactly as for g++-15 and clang++-20 above.
  compile-on-other-distros:
    name: Compile (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
    container: ${{ matrix.image }}
    steps:
      # Before the checkout, and the reason this job cannot just reuse the matrix
      # above. actions/checkout falls back to downloading a tarball through the REST
      # API when git is missing, and that path cannot fetch submodules -- so the
      # build would fail much later, on a missing toml11 header, with nothing
      # pointing at the real cause.
      - name: Install git, so the checkout can fetch submodules
        run: dnf -y install --setopt=install_weak_deps=False git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc-c++ cmake make wget tar gzip \
            boost-devel \
            eigen3-devel \
            netcdf-devel netcdf-cxx4-devel \
            blas-devel \
            python3-devel
          # Diagnostics only -- which Eigen Fedora shipped is the interesting
          # part, and it moved header between 3.4 and 5.0. `|| true` because run
          # steps use `bash -e` and grep exits non-zero on no match, which would
          # fail the step over a log line.
          echo "--- versions ---"
          g++ --version | head -1
          grep -rhE 'define EIGEN_(WORLD|MAJOR|MINOR|PATCH)_VERSION' \
            /usr/include/eigen3/Eigen/src/Core/util/Macros.h \
            /usr/include/eigen3/Eigen/Version 2>/dev/null || true

      # A key of its own: this SUNDIALS is built in a Fedora container against a
      # different libc and libstdc++ from the ubuntu legs', and the two must not
      # restore each other's.
      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ matrix.image }}

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      # NETCDF_DIR deliberately unset, so Makefile.config asks pkg-config.
      - name: Configure Makefile.local
        run: |
          cat > Makefile.local <<'EOF'
          CXX = g++
          SUNDIALS_DIR = ./sundials/install
          EIGEN_DIR = /usr/include/eigen3
          EOF
          cat Makefile.local

      - name: Build solver
        run: make MaNTA -j$(nproc)

      - name: Build Python module
        run: make python -j$(nproc)

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake wget \
            libboost-dev \
            libeigen3-dev \
            libnetcdf-dev libnetcdf-c++4-dev \
            libblas-dev

      - name: Cache SUNDIALS
        id: cache-sundials
        uses: actions/cache@v4
        with:
          path: sundials/install
          key: sundials-${{ env.SUNDIALS_VERSION }}-${{ runner.os }}-gcc14

      - name: Build SUNDIALS
        if: steps.cache-sundials.outputs.cache-hit != 'true'
        run: ./build_sundials

      - name: Configure Makefile.local
        run: |
          cat > Makefile.local <<'EOF'
          CXX = g++-14
          SUNDIALS_DIR = ./sundials/install
          EIGEN_DIR = /usr/include/eigen3
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt gcovr

      - name: Run coverage
        run: make coverage -j$(nproc)

      - name: Summarise
        if: always()
        run: |
          # Guarded because this step runs on always(). Without the guard a failed
          # coverage step is followed by `tail: cannot open ...: No such file or
          # directory`, and that becomes the *last* error in the log -- burying the
          # real one several hundred lines up.
          if [ ! -f coverage/summary.txt ]; then
            echo 'Coverage report not produced -- see the "Run coverage" step.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Coverage (in-scope: numerical core + Python bindings)'
            echo '```'
            tail -n 40 coverage/summary.txt
            echo '```'
            echo '### PhysicsCases (informational)'
            echo '```'
            # That report comes from a `-`-prefixed gcovr in the coverage target,
            # so it is allowed to be absent while the in-scope one succeeded.
            tail -n 20 coverage/physics.txt 2>/dev/null || echo '(not produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
