[configuration]

TransportSystem = "ADTestProblem"

Polynomial_degree = 5
Grid_size = 10
Lower_boundary =  0.0
Upper_boundary =  1.0

tau = 1.0

t_final = 1.0
delta_t = 0.25

Relative_tolerance = 1.0e-4
Absolute_tolerance = 1.0e-3

[AutodiffTransportSystem]

uL = [0.0]
isLowerDirichlet = false
uR = [0.3]
isUpperDirichlet = true

InitialHeights = [0.3]
InitialProfile = ["Uniform"]

[ADTestProblem]
kappa = 1.0

# afn is deliberately absent, taking ADTestProblem's default of 1.0. It used to
# be 50.0 here, which made this file fail with IDA_ERR_FAIL on its first step --
# and the reason is worth knowing, because nothing about the message says it.
#
# afn cancels out of the continuous problem: it multiplies aFn, the flux and the
# source alike, so the physics does not depend on it. Measured, at the final time
# of this run: u and q are identical between afn = 1 and afn = 10 (0.4646 and
# 0.3225), while sigma scales exactly with it (3.76 -> 37.6). So at afn = 50 the
# flux rows carry values around 190 while Absolute_tolerance stays at 1e-3, which
# is a relative demand of 5e-6 on them -- fifty times tighter than the 1e-4
# Relative_tolerance this file asks for. IDA needs h < 1e-7 to meet it and
# MinStepSize defaults to exactly 1e-7.
#
# The log looks like something else entirely. dsm sticks at 2.466262873077 for
# five attempts, which is the documented signature of an inconsistent initial
# condition -- but the h column shows h clamped at 1e-7 for those same five, so it
# is one step retried, not an error estimate that will not shrink. Read h before
# dsm.
#
# Tests/RegressionTests/ADTest.conf is this configuration at Grid_size = 5 and is
# what actually pins the case; it omits afn too.


